<article class="service-card">
  <div class="service-copy">
    <h2>{{ service.name }}</h2>
    <p *ngIf="service.description">{{ service.description }}</p>
    <strong *ngIf="price">{{ page.startsAtLabel }} {{ price }}</strong>
    <div *ngIf="service.discount?.enabled && discountLabel" class="discount">
      <i class="fa" [ngClass]="page.discountIcon || 'fa-lock'" aria-hidden="true"></i>
      <span>{{ discountLabel }}</span>
    </div>
  </div>
  <div class="service-media">
    <img *ngIf="imageUrl && !imageFailed" [src]="imageUrl" [alt]="service.serviceImageAlt || service.name"
      loading="lazy" decoding="async" [style.object-fit]="page.serviceImageFit || 'cover'"
      [style.object-position]="page.serviceImagePosition || 'center'" (error)="imageFailed = true">
    <div *ngIf="!imageUrl || imageFailed" class="image-fallback" aria-hidden="true"><i class="fa fa-paw"></i></div>
    <button type="button" (click)="book.emit(service)" [attr.aria-label]="(page.bookNowLabel || '') + ' ' + service.name">
      {{ page.bookNowLabel }}
    </button>
  </div>
</article>
